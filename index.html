<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5G Telecom & Layer 3 Mastery Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .option-btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }
  </style>
</head>

<body
  class="bg-slate-900 text-slate-100 antialiased p-3 sm:p-6 font-sans min-h-screen flex items-center justify-center">
  <div class="w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-2xl p-5 sm:p-8 shadow-2xl">

    <!-- Header -->
    <header class="flex items-center justify-between border-b border-slate-700 pb-4 mb-6">
      <div>
        <div class="flex items-center gap-2">
          <span
            class="bg-blue-600/20 text-blue-400 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-blue-500/30">3GPP
            NR Rel-15/17</span>
          <span
            class="bg-purple-600/20 text-purple-400 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-purple-500/30">Layer
            3 Focus</span>
        </div>
        <h1 class="text-xl sm:text-2xl font-bold mt-2 text-white">5G Telecom & L3 Protocol Quiz</h1>
      </div>
      <div id="score-badge" class="text-right">
        <span class="text-xs text-slate-400 block">Score</span>
        <span id="current-score" class="text-2xl font-bold text-blue-400">0</span>
        <span class="text-xs text-slate-400">/ 20</span>
      </div>
    </header>

    <!-- Progress Bar -->
    <div class="mb-6">
      <div class="flex justify-between text-xs text-slate-400 mb-1.5">
        <span id="question-progress-label">Question 1 of 10</span>
        <div class="flex items-center gap-3">
          <span id="category-badge" class="font-medium text-blue-400">RRC Layer 3</span>
          <span id="timer-display" class="flex items-center gap-1 font-mono font-bold text-sm text-amber-400">
            <span>⏱</span><span id="timer-seconds">20</span><span class="text-xs font-normal">s</span>
          </span>
        </div>
      </div>
      <div class="w-full bg-slate-700 h-2.5 rounded-full overflow-hidden relative">
        <div id="progress-bar-fill" class="bg-blue-500 h-full rounded-full transition-all duration-300"
          style="width: 10%;"></div>
      </div>
      <!-- Timer Bar -->
      <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden mt-1.5">
        <div id="timer-bar-fill" class="bg-amber-400 h-full rounded-full transition-all duration-1000 ease-linear"
          style="width: 100%;"></div>
      </div>
    </div>

    <!-- Quiz Container -->
    <main id="quiz-screen">
      <div class="mb-6">
        <h2 id="question-text" class="text-base sm:text-lg font-semibold leading-snug min-h-[3rem] text-slate-100">
          Loading question...
        </h2>
      </div>

      <!-- Options List -->
      <div id="options-container" class="space-y-3 mb-6">
        <!-- Rendered dynamically -->
      </div>

      <!-- Explanation Box -->
      <div id="explanation-box" class="hidden rounded-xl p-4 border mb-5 transition-all">
        <div class="flex items-center gap-2 mb-1.5">
          <span id="explanation-badge" class="text-xs font-bold px-2 py-0.5 rounded"></span>
          <span class="text-xs text-slate-400 font-mono" id="spec-reference">3GPP Spec</span>
        </div>
        <p id="explanation-text" class="text-xs sm:text-sm leading-relaxed text-slate-300"></p>
      </div>

      <!-- Footer / Next Button -->
      <div class="flex justify-between items-center pt-2">
        <button id="restart-mid-btn" class="px-4 py-2 border border-slate-600 hover:border-slate-400 text-slate-400 hover:text-white font-medium text-xs rounded-xl transition duration-150 active:scale-95">
          🔄 Restart
        </button>
        <span id="hint-text" class="text-xs text-slate-400 italic">Select an option to check your answer</span>
        <button id="next-btn"
          class="hidden px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm rounded-xl transition duration-150 shadow-md active:scale-95">
          Next Question →
        </button>
      </div>
    </main>

    <!-- Results Screen -->
    <div id="results-screen" class="hidden text-center py-6">
      <div
        class="w-20 h-20 rounded-full mx-auto flex items-center justify-center mb-4 border-2 border-blue-500/30 bg-blue-500/10">
        <span id="final-trophy" class="text-3xl">🏆</span>
      </div>
      <h2 class="text-2xl font-bold mb-2 text-white">Test Completed!</h2>
      <p id="result-message" class="text-sm text-slate-400 max-w-md mx-auto mb-6"></p>

      <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto mb-8">
        <div class="p-4 rounded-xl border border-slate-700 bg-slate-900/50">
          <div class="text-xs text-slate-400 mb-1">Final Score</div>
          <div id="final-score-val" class="text-2xl font-bold text-blue-400">0%</div>
        </div>
        <div class="p-4 rounded-xl border border-slate-700 bg-slate-900/50">
          <div class="text-xs text-slate-400 mb-1">Correct Answers</div>
          <div id="final-correct-val" class="text-2xl font-bold text-emerald-400">0 / 20</div>
        </div>
      </div>

      <div class="flex justify-center gap-3">
        <button id="restart-btn"
          class="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm rounded-xl transition shadow-lg active:scale-95">
          🔄 Retake Quiz
        </button>
      </div>
    </div>

  </div>

  <script>
    const questions = [
      {
        category: "RRC States",
        spec: "3GPP TS 38.331",
        question: "Which new RRC state was introduced in 5G NR to enable ultra-fast state transition and power saving while retaining the UE context in the RAN?",
        options: [
          "RRC_IDLE",
          "RRC_STANDBY",
          "RRC_INACTIVE",
          "RRC_SUSPENDED"
        ],
        answer: 2,
        explanation: "5G NR introduced RRC_INACTIVE state. The UE sleeps to conserve power, but the UE context and radio bearer configs remain stored in the gNodeB. This allows resuming data transfer in milliseconds without re-authenticating with the 5G Core."
      },
      {
        category: "Access Stratum L3",
        spec: "3GPP TS 38.331",
        question: "In the 5G radio protocol stack, which entity terminates the Access Stratum (AS) Layer 3 protocol on the network side?",
        options: [
          "AMF (Access and Mobility Management Function)",
          "gNB-CU-CP (Centralized Unit - Control Plane)",
          "gNB-DU (Distributed Unit)",
          "SMF (Session Management Function)"
        ],
        answer: 1,
        explanation: "In disaggregated gNB architectures (O-RAN / 3GPP Option 2 split), the RRC protocol (AS Layer 3) terminates at the gNB-CU-CP, whereas user plane protocols (SDAP/PDCP) terminate at the CU-UP, and RLC/MAC terminate at the DU."
      },
      {
        category: "Non-Access Stratum (NAS)",
        spec: "3GPP TS 24.501",
        question: "Which two sublayers constitute the 5G Non-Access Stratum (NAS) Layer 3 protocols running between UE and 5G Core?",
        options: [
          "RRC and PDCP",
          "5GMM (Mobility Management) and 5GSM (Session Management)",
          "SDAP and MAC",
          "AMF and UPF"
        ],
        answer: 1,
        explanation: "5G NAS Layer 3 is split into 5GMM (5G Mobility Management, terminating at AMF) for registration, paging, and security, and 5GSM (5G Session Management, terminating at SMF) for managing PDU sessions and IP address allocation."
      },
      {
        category: "Signaling Radio Bearers",
        spec: "3GPP TS 38.331",
        question: "Which Signaling Radio Bearer (SRB) is used for direct RRC communication between the UE and the Secondary Node (SN) during Dual Connectivity (EN-DC / NR-DC)?",
        options: [
          "SRB0",
          "SRB1",
          "SRB2",
          "SRB3"
        ],
        answer: 3,
        explanation: "SRB3 is dedicated to direct RRC signaling between the UE and the Secondary Node (SN) in Dual Connectivity architectures (like EN-DC or NR-DC), bypassing the Master Node for faster secondary cell reconfigurations."
      },
      {
        category: "Layer 2 vs Layer 3",
        spec: "3GPP TS 37.324",
        question: "Which new Layer 2 protocol was introduced in 5G directly beneath Layer 3 to handle QoS flow-to-DRB mapping and reflective QoS marking?",
        options: [
          "PDCP",
          "SDAP (Service Data Adaptation Protocol)",
          "GTP-U",
          "RLC"
        ],
        answer: 1,
        explanation: "SDAP (Service Data Adaptation Protocol) was introduced in 5G to bridge L3 QoS flows defined by the 5G Core with L2 Data Radio Bearers (DRBs) configured by RRC."
      },
      {
        category: "System Information Broadcast",
        spec: "3GPP TS 38.331",
        question: "In 5G NR RRC, which block contains essential scheduling information and cell access barring configuration needed to evaluate if a UE can camp on a cell?",
        options: [
          "MIB (Master Information Block)",
          "SIB1 (System Information Block 1)",
          "SIB2",
          "PBCH DMRS"
        ],
        answer: 1,
        explanation: "SIB1 (often referred to as 'Remaining Minimum System Information' or RMSI) carries cell selection info, PLMN identities, and scheduling information for other on-demand SIBs. MIB only carries basic subcarrier spacing, frame numbers, and SIB1 scheduling."
      },
      {
        category: "O-RAN Functional Split",
        spec: "3GPP / O-RAN WG3",
        question: "Which 3GPP standardized interface connects the gNB-CU-CP (RRC Layer 3) with the gNB-CU-UP (User Plane)?",
        options: [
          "F1-C",
          "E1",
          "Xn-C",
          "NG-C"
        ],
        answer: 1,
        explanation: "The E1 interface connects the CU-Control Plane (hosting RRC and control PDCP) with the CU-User Plane (hosting SDAP and UP PDCP). F1-C connects CU-CP to DU, and Xn is inter-gNB."
      },
      {
        category: "PDU Session Management",
        spec: "3GPP TS 24.501",
        question: "During 5G PDU Session Establishment, which NAS Layer 3 entity authorizes the request and selects the UPF (User Plane Function)?",
        options: [
          "AMF",
          "SMF",
          "UDM",
          "NRF"
        ],
        answer: 1,
        explanation: "The SMF (Session Management Function) is the 5GC control-plane function handling 5GSM messages. It establishes PDU sessions, allocates UE IP addresses, and selects the optimal UPF via N4 interface (PFCP)."
      },
      {
        category: "RRC Procedures",
        spec: "3GPP TS 38.331",
        question: "When a UE transitions from RRC_INACTIVE to RRC_CONNECTED, which RRC message does it send to the gNB?",
        options: [
          "RRCSetupRequest",
          "RRCReestablishmentRequest",
          "RRCResumeRequest",
          "RRCConnectionRequest"
        ],
        answer: 2,
        explanation: "The UE transmits an RRCResumeRequest message along with its I-RNTI (Inactive Radio Network Temporary Identifier) and shortMAC-I for authentication to rapidly resume the suspended radio bearers."
      },
      {
        category: "5G Core & NAS Security",
        spec: "3GPP TS 33.501",
        question: "At which 5G network function does NAS security (ciphering and integrity protection for 5GMM and 5GSM) terminate?",
        options: [
          "gNB-CU-CP",
          "AMF (Access and Mobility Management Function)",
          "AUSF (Authentication Server Function)",
          "UPF (User Plane Function)"
        ],
        answer: 1,
        explanation: "NAS security terminates at the AMF. The AMF negotiates NAS ciphering and integrity keys (K_NASint, K_NASenc) derived from the Kamf key, keeping control signaling end-to-end encrypted between UE and 5G Core."
      },
      // ==================== 5G HANDOVER & CHO QUESTIONS ====================
      {
        category: "5G Handover Basics",
        spec: "3GPP TS 38.300",
        question: "In 5G NR, what is the primary RRC message used by the source gNB to command the UE to perform a handover to a target cell?",
        options: [
          "RRCSetup",
          "RRCReconfiguration (with reconfigurationWithSync)",
          "RRCResumeRequest",
          "MobilityFromNRCommand"
        ],
        answer: 1,
        explanation: "The source gNB sends an RRCReconfiguration message containing the 'reconfigurationWithSync' IE to the UE. This IE includes the target cell's configuration, new C-RNTI, and RACH parameters needed to access the target cell."
      },
      {
        category: "Handover Types",
        spec: "3GPP TS 38.300",
        question: "Which 3GPP interface is used for inter-gNB handover when a direct connection exists between the source and target gNBs (without involving the 5G Core)?",
        options: [
          "NG interface (N2)",
          "F1 interface",
          "Xn interface",
          "E1 interface"
        ],
        answer: 2,
        explanation: "Xn-based handover is performed directly between two gNBs over the Xn interface without involving the AMF in path switching until after the handover completes. When no Xn connection exists, the handover falls back to NG (N2)-based handover through the AMF."
      },
      {
        category: "Measurement Events",
        spec: "3GPP TS 38.331",
        question: "Which NR measurement event triggers when a neighbour cell becomes better than the serving cell by an offset, and is the most commonly used event for handover decisions?",
        options: [
          "Event A1 (Serving becomes better than threshold)",
          "Event A2 (Serving becomes worse than threshold)",
          "Event A3 (Neighbour becomes offset better than serving)",
          "Event A5 (Serving worse than threshold1 AND neighbour better than threshold2)"
        ],
        answer: 2,
        explanation: "Event A3 fires when a neighbour cell's RSRP/RSRQ/SINR becomes better than the serving cell's by a configured offset (a3-Offset) for a time-to-trigger (TTT) duration. It is the primary event used for intra-frequency and inter-frequency mobility-based handovers."
      },
      {
        category: "Conditional Handover (CHO)",
        spec: "3GPP TS 38.331 (Rel-16)",
        question: "What is Conditional Handover (CHO) in 5G NR?",
        options: [
          "A handover that requires NAS-level approval from the AMF before execution",
          "A handover where the UE receives candidate cell configurations in advance and executes the handover autonomously when configured conditions are met",
          "A handover that is only triggered by the network without any UE measurements",
          "A handover exclusively used for inter-RAT mobility from NR to LTE"
        ],
        answer: 1,
        explanation: "CHO (introduced in 3GPP Rel-16) allows the source gNB to pre-configure the UE with one or more candidate target cell configurations along with execution conditions. The UE autonomously triggers the handover when the conditions (e.g., measurement thresholds) are satisfied, significantly reducing handover failures and latency."
      },
      {
        category: "CHO Execution",
        spec: "3GPP TS 38.331 (Rel-16)",
        question: "In Conditional Handover, what happens if the UE's measurement conditions are met for multiple candidate target cells simultaneously?",
        options: [
          "The handover is cancelled and the UE stays on the source cell",
          "The UE selects the first candidate cell in the configured list order",
          "The UE selects the cell with the best measured quality among the candidates whose conditions are satisfied",
          "The network sends a new RRCReconfiguration to resolve the conflict"
        ],
        answer: 2,
        explanation: "When multiple CHO candidate cells satisfy their execution conditions simultaneously, the UE selects the cell with the best measured radio quality (e.g., highest RSRP). This ensures the UE always moves to the strongest available target, maximizing handover success rate."
      },
      {
        category: "CHO vs Baseline HO",
        spec: "3GPP TS 38.300 (Rel-16)",
        question: "What is the key advantage of Conditional Handover (CHO) over baseline (legacy) handover in 5G NR?",
        options: [
          "CHO eliminates the need for measurement reports entirely",
          "CHO reduces handover interruption time to zero",
          "CHO reduces handover failure rate (HOF) by decoupling the handover preparation and execution phases",
          "CHO allows handover without any Xn or NG signaling"
        ],
        answer: 2,
        explanation: "In baseline HO, the network prepares and immediately triggers execution, creating a tight timing dependency. CHO decouples these phases: preparation happens early (when radio is still good), and execution happens later when conditions are met. This drastically reduces HOF, especially in high-speed mobility and ping-pong scenarios."
      },
      {
        category: "CHO Configuration",
        spec: "3GPP TS 38.331 (Rel-16)",
        question: "How does the source gNB deliver CHO candidate cell configurations to the UE?",
        options: [
          "Via SIB broadcast from the target cell",
          "Via NAS message through the AMF",
          "Via RRCReconfiguration message containing condReconfigToAddModList with conditionalReconfiguration IE",
          "Via MAC Control Element (MAC CE)"
        ],
        answer: 2,
        explanation: "The source gNB sends an RRCReconfiguration message containing the 'condReconfigToAddModList' IE, which includes the candidate cell configurations and their associated execution conditions (measurement thresholds and events). The UE stores these and evaluates them against ongoing measurements."
      },
      {
        category: "DAPS Handover",
        spec: "3GPP TS 38.300 (Rel-16)",
        question: "What is DAPS (Dual Active Protocol Stack) handover in 5G NR?",
        options: [
          "A handover where the UE maintains connections to both source and target cells simultaneously during the handover to achieve zero-interruption data transfer",
          "A handover between two different PLMN operators",
          "A handover that uses two NAS connections at the same time",
          "A handover exclusive to Non-Standalone (NSA) mode"
        ],
        answer: 0,
        explanation: "DAPS handover (Rel-16) allows the UE to maintain an active data connection with the source cell while simultaneously performing RACH and synchronization with the target cell. This minimizes or eliminates user-plane interruption time, which is critical for URLLC services."
      },
      {
        category: "Handover Interruption",
        spec: "3GPP TS 38.133",
        question: "In a standard intra-frequency 5G NR handover (baseline, non-DAPS), what is the typical maximum user-plane interruption time?",
        options: [
          "0 ms (zero interruption)",
          "Up to 6 ms",
          "Up to 20–30 ms",
          "Up to 200 ms"
        ],
        answer: 2,
        explanation: "During a baseline intra-frequency NR handover, the UE must detach from the source cell, perform random access (RACH) on the target cell, and re-establish the uplink. This results in a typical interruption of around 20–30 ms (specified in TS 38.133), though DAPS handover can reduce this to near-zero."
      },
      {
        category: "CHO & Mobility Robustness",
        spec: "3GPP TS 38.300 / TS 38.331",
        question: "In the context of Mobility Robustness Optimization (MRO), what specific problem does CHO help solve compared to baseline handover?",
        options: [
          "Eliminates the need for Handover Margin (HOM) tuning",
          "Prevents Too-Early Handover, Too-Late Handover, and Handover to Wrong Cell failures by allowing early preparation of multiple candidates",
          "Removes the requirement for Time-to-Trigger (TTT) in measurement events",
          "Replaces the A3 measurement event with a new CHO-specific event"
        ],
        answer: 1,
        explanation: "CHO addresses all three classic HOF types: Too-Late HO (radio link fails before HO command arrives), Too-Early HO (UE handed over too soon and bounces back), and HO to Wrong Cell (UE sent to a sub-optimal target). By pre-configuring multiple candidates with condition-based execution, CHO provides a safety net that baseline single-target HO cannot offer."
      }
    ];

    // Shuffle questions randomly (Fisher-Yates algorithm)
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    shuffleArray(questions);

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let timerInterval = null;
    let timeLeft = 20;
    const TIMER_DURATION = 20;

    const questionProgressLabel = document.getElementById('question-progress-label');
    const categoryBadge = document.getElementById('category-badge');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const explanationBox = document.getElementById('explanation-box');
    const explanationBadge = document.getElementById('explanation-badge');
    const specReference = document.getElementById('spec-reference');
    const timerSecondsEl = document.getElementById('timer-seconds');
    const timerBarFill = document.getElementById('timer-bar-fill');
    const timerDisplay = document.getElementById('timer-display');
    const explanationText = document.getElementById('explanation-text');
    const nextBtn = document.getElementById('next-btn');
    const currentScoreEl = document.getElementById('current-score');
    const quizScreen = document.getElementById('quiz-screen');
    const resultsScreen = document.getElementById('results-screen');
    const restartBtn = document.getElementById('restart-btn');

    function startTimer() {
      stopTimer();
      timeLeft = TIMER_DURATION;
      timerSecondsEl.textContent = timeLeft;
      timerBarFill.style.width = '100%';
      timerDisplay.classList.remove('text-red-400');
      timerDisplay.classList.add('text-amber-400');
      timerBarFill.classList.remove('bg-red-500');
      timerBarFill.classList.add('bg-amber-400');

      timerInterval = setInterval(() => {
        timeLeft--;
        timerSecondsEl.textContent = timeLeft;
        timerBarFill.style.width = `${(timeLeft / TIMER_DURATION) * 100}%`;

        // Turn red when 5 seconds or less remain
        if (timeLeft <= 5) {
          timerDisplay.classList.remove('text-amber-400');
          timerDisplay.classList.add('text-red-400');
          timerBarFill.classList.remove('bg-amber-400');
          timerBarFill.classList.add('bg-red-500');
        }

        if (timeLeft <= 0) {
          stopTimer();
          timeExpired();
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function timeExpired() {
      if (answered) return;
      answered = true;
      document.getElementById('hint-text').classList.add('hidden');

      const q = questions[currentQuestionIndex];
      const buttons = optionsContainer.querySelectorAll('button');
      buttons.forEach(btn => btn.disabled = true);

      // Highlight the correct answer in green
      buttons[q.answer].classList.remove('border-slate-700', 'bg-slate-900/60');
      buttons[q.answer].classList.add('border-emerald-500', 'bg-emerald-500/10', 'text-emerald-300');

      explanationBadge.textContent = "⏰ TIME'S UP";
      explanationBadge.className = "text-xs font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30";
      explanationBox.className = "rounded-xl p-4 border border-amber-500/30 bg-amber-500/10 mb-5";

      specReference.textContent = q.spec;
      explanationText.textContent = q.explanation;
      explanationBox.classList.remove('hidden');

      if (currentQuestionIndex < questions.length - 1) {
        nextBtn.textContent = "Next Question →";
      } else {
        nextBtn.textContent = "See Final Results 🏆";
      }
      nextBtn.classList.remove('hidden');
    }

    function renderQuestion() {
      answered = false;
      const q = questions[currentQuestionIndex];

      questionProgressLabel.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
      categoryBadge.textContent = q.category;
      progressBarFill.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
      questionText.textContent = q.question;

      explanationBox.classList.add('hidden');
      nextBtn.classList.add('hidden');
      document.getElementById('hint-text').classList.remove('hidden');

      optionsContainer.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "option-btn w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 hover:border-blue-500/50 hover:bg-slate-700/40 transition duration-150 flex items-start gap-3 group";
        btn.innerHTML = `
          <span class="w-6 h-6 shrink-0 rounded-full border border-slate-600 flex items-center justify-center text-xs font-semibold group-hover:border-blue-400 group-hover:text-blue-400 text-slate-300">${String.fromCharCode(65 + idx)}</span>
          <span class="text-xs sm:text-sm pt-0.5 leading-snug text-slate-200">${opt}</span>
        `;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });

      // Start the 20-second countdown
      startTimer();
    }

    function selectOption(selectedIndex) {
      if (answered) return;
      answered = true;
      stopTimer();
      document.getElementById('hint-text').classList.add('hidden');

      const q = questions[currentQuestionIndex];
      const buttons = optionsContainer.querySelectorAll('button');

      buttons.forEach(btn => btn.disabled = true);

      if (selectedIndex === q.answer) {
        score++;
        currentScoreEl.textContent = score;
        buttons[selectedIndex].classList.remove('border-slate-700', 'bg-slate-900/60');
        buttons[selectedIndex].classList.add('border-emerald-500', 'bg-emerald-500/10', 'text-emerald-300');

        explanationBadge.textContent = "CORRECT";
        explanationBadge.className = "text-xs font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        explanationBox.className = "rounded-xl p-4 border border-emerald-500/30 bg-emerald-500/10 mb-5";
      } else {
        buttons[selectedIndex].classList.remove('border-slate-700', 'bg-slate-900/60');
        buttons[selectedIndex].classList.add('border-red-500', 'bg-red-500/10', 'text-red-300');

        buttons[q.answer].classList.remove('border-slate-700', 'bg-slate-900/60');
        buttons[q.answer].classList.add('border-emerald-500', 'bg-emerald-500/10', 'text-emerald-300');

        explanationBadge.textContent = "INCORRECT";
        explanationBadge.className = "text-xs font-bold px-2 py-0.5 rounded bg-red-500/20 text-red-300 border border-red-500/30";
        explanationBox.className = "rounded-xl p-4 border border-red-500/30 bg-red-500/10 mb-5";
      }

      specReference.textContent = q.spec;
      explanationText.textContent = q.explanation;
      explanationBox.classList.remove('hidden');

      if (currentQuestionIndex < questions.length - 1) {
        nextBtn.textContent = "Next Question →";
      } else {
        nextBtn.textContent = "See Final Results 🏆";
      }
      nextBtn.classList.remove('hidden');
    }

    nextBtn.onclick = () => {
      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      quizScreen.classList.add('hidden');
      resultsScreen.classList.remove('hidden');

      const percentage = Math.round((score / questions.length) * 100);
      document.getElementById('final-score-val').textContent = `${percentage}%`;
      document.getElementById('final-correct-val').textContent = `${score} / ${questions.length}`;

      const msgEl = document.getElementById('result-message');
      const trophyEl = document.getElementById('final-trophy');

      if (percentage >= 80) {
        trophyEl.textContent = "🌟";
        msgEl.textContent = "Outstanding! You have exceptional mastery of 5G NR Layer 3, RRC states, and 3GPP control plane architecture.";
      } else if (percentage >= 60) {
        trophyEl.textContent = "👍";
        msgEl.textContent = "Great job! You have a solid grasp of 5G fundamentals and protocol layers, with minor gaps in specialized split/NAS procedures.";
      } else {
        trophyEl.textContent = "📚";
        msgEl.textContent = "Good effort! 5G Layer 3 has deep nuances across RRC, 5GMM, and 5GSM. Review the spec references and try again!";
      }
    }

    function resetQuiz() {
      stopTimer();
      shuffleArray(questions);
      currentQuestionIndex = 0;
      score = 0;
      currentScoreEl.textContent = '0';
      resultsScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');
      renderQuestion();
    }

    restartBtn.onclick = resetQuiz;
    document.getElementById('restart-mid-btn').onclick = resetQuiz;

    // Initialize
    renderQuestion();
  </script>
</body>

</html>
